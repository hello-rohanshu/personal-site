backend:
  name: github
  repo: hello-rohanshu/selfscope
  branch: next-release

media_folder: public/uploads
public_folder: /uploads

collections:
  - name: projects
    label: Projects
    folder: src/content/projects
    create: true
    format: frontmatter
    slug: '{{slug}}'
    fields:
      # --- Core Details ---
      - { label: Title,       name: title,       widget: string }
      - { label: Visible,     name: visible,     widget: boolean, default: true }
      - { label: Description, name: description, widget: text, required: false }
      - label: Status
        name: status
        widget: select
        options: [working-on, paused, planned]
      - label: ETA
        name: eta
        widget: datetime
        date_format: YYYY-MM-DD
        time_format: false
        required: false
      - label: Effort
        name: effort
        widget: select
        options: [high, medium, low]
        required: false
      - label: Leverage
        name: leverage
        widget: select
        options: [high, medium, low]
        required: false

      # --- Links & Actions ---
      - label: Link
        name: link
        widget: string
        required: false
        pattern: ['^https?://', 'Must start with http:// or https://']
      - label: Changelog
        name: changelog
        widget: string
        required: false
        pattern: ['^https?://', 'Must start with http:// or https://']
      - { label: CTA Label,   name: ctaLabel,    widget: string, required: false }

      # --- Metadata ---
      - { label: Role,        name: role,        widget: string, required: false }
      - { label: Order,       name: order,       widget: number, required: false }
